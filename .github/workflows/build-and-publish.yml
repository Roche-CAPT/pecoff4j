name: Build
on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    name: Java ${{ matrix.java }} build
    steps:
      - uses: actions/checkout@v6
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B package
      - name: Test
        run: mvn -B test
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags')
    name: Publish
    needs:
      - build
    steps:
      - uses: actions/checkout@v6
      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::$(echo $GITHUB_REF | cut -d / -f 3)
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Publish package
        run: |
          echo "Publishing version ${{ steps.get_version.outputs.VERSION }} to GitHub Packages..."
          mvn -B versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }}
          mvn -B clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: false
          files: ./target/pecoff4j-${{ steps.get_version.outputs.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
